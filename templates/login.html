<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluffelSkills - {{ _('Sign in') }}</title>
    <link rel="stylesheet" href="../static/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar" style="background-color: #081534;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" style="color: #fff;"><a class="nav-link" href="{{ url_for('home_page') }}">FluffelSkills</a></span>
            {% include '_language_switcher.html' %}
        </div>
    </nav>

    <div class="login-body">
        <div class="login-container">
            <form class="login-form" action="/login" method="POST">
                <h2><b>Login</b></h2>
                <input type="text" name="login" placeholder="{{ _('Username or email') }}" required>
                <input type="password" name="password" placeholder="{{ _('Password') }}" required>
                <button type="submit">{{ _('Sign in') }}</button>
            </form>
            <p><br>{{ _('Do not have an account yet?') }}<br><a href="{{ url_for('register') }}">{{ _('Create one here!') }}</a></p>
        </div>
    </div>
</body>
</html>
