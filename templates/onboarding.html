<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluffelSkills - Onboarding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/css/onboarding.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/js/tom-select.complete.min.js"></script>
</head>
<body data-invalid-job-message="Bitte wähle einen der vorgeschlagenen Berufe aus der Liste aus! Eigene Eingaben sind aktuell noch nicht freigeschaltet.">
    <nav class="navbar" style="background-color: #081534;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" style="color: #fff;">FluffelSkills</span>
        </div>
    </nav>

    <div class="onboarding-body">
        <div class="onboarding-container">
            <h2><b>Onboarding</b></h2>
            
            <!-- 1. Der optische Stepper -->
            <div class="stepper-wrapper">
                <div class="stepper-item active" id="step-indicator-1">
                    <div class="step-counter">1</div>
                </div>
                <div class="stepper-item" id="step-indicator-2">
                    <div class="step-counter">2</div>
                </div>
                <div class="stepper-item" id="step-indicator-3">
                    <div class="step-counter">3</div>
                </div>
            </div>

            <!-- 2. Das Formular -->
            <form class="onboarding-form" id="regForm" action="/onboarding" method="POST">
                
                <!-- SCHRITT 1 -->
                <div class="form-step active" id="step-1">
                    <h3>Persönliches</h3>
                    <input type="text" name="first_name" placeholder="Vorname" required>
                    <input type="text" name="last_name" placeholder="Nachname" required>
                    <label>Geburtsdatum:</label>
                    <input type="date" name="birthdate" required>
                </div>

                <!-- SCHRITT 2 (Hier wurde das Suchfeld integriert) -->
                <div class="form-step" id="step-2">
                    <h3>Ziele und Wohnort</h3>
                    
                    <!-- Suchbares Input-Feld verknüpft mit der datalist -->
                    <input type="text" name="goal_job" id="goal_job" list="job_liste" placeholder="Traum-Beruf suchen oder eingeben..." autocomplete="off" required>
                    
                    <!-- Dynamische Jobliste aus Flask -->
                    <datalist id="job_liste">
                        {% for job in jobs %}
                            <option value="{{ job.titel }}">
                        {% endfor %}
                    </datalist>

                    <input type="text" name="country" placeholder="Land" required>
                    <input type="text" name="city" placeholder="Stadt" required>
                </div>

                <!-- SCHRITT 3 -->
                <div class="form-step" id="step-3">
                    <h3>Abschluss, Fähigkeiten und Berufserfahrung</h3>
                    <select name="diploma" required>
                        <option value="" disabled selected>Wähle deinen Abschluss</option>
                        <optgroup label="Schulabschlüsse">
                            <option value="no_diploma">Kein Abschluss</option>
                            <option value="primary_school">Grundschule</option>
                            <option value="secondary_school">Hauptschule</option>
                            <option value="intermediate_secondary_school">Realschule</option>
                            <option value="high_school_diploma">Abitur</option>
                        </optgroup>
                        <optgroup label="Hochschulabschlüsse">
                            <option value="bachelor">Bachelor</option>
                            <option value="master">Master</option>
                            <option value="doctorate">Promotion</option>
                        </optgroup>
                    </select>
                    <input type="number" name="grade" placeholder="Abschlussnote (oder erwartete Abschlussnote)" required>
                    <select id="auswahl" name="skills" multiple autocomplete="off" placeholder="Fähigkeiten">
                        {% for skill in skills %}
                            <option value="{{ skill.skill_name }}">{{ skill.skill_name }}</option>
                        {% endfor %}
                    </select>
                    <textarea name="job_experience" placeholder="Berufserfahrung (Format: Position/Rolle, Unternehmen, STARTJahr-ENDJahr); z.B.: Softwareentwickler, TechCorp, 2020-2023"></textarea>
                    <input type="number" name="time_to_learn" placeholder="Zeit zum Lernen pro Woche in Stunden" required>
                    <select name="visibility" required>
                        <option value="" disabled selected>Wähle die Sichtbarkeit des Profils</option>
                        <option value="private">Privat</option>
                        <option value="public">Öffentlich</option>
                    </select>
                </div>

                <!-- Navigations-Buttons -->
                <div class="btn-container">
                    <button type="button" class="btn-prev" id="prevBtn" onclick="nextPrev(-1)" style="display:none;">Zurück</button>
                    <button type="button" class="btn-next" id="nextBtn" onclick="nextPrev(1)">Weiter</button>
                </div>
            </form>

            <!--Schritt 4-->
            <div class="form-complete" id="step-4" hidden>
                <h3>Fertig!</h3>
                <p>Unsere KI erstellt nun dein Skill-Profil...</p>
                <p>Meistens dauert das nur 15 Sekunden.</p>
                <p>Danach wirst du automatisch zum Dashboard weitergeleitet.</p>
                <div class="progress" id="progressBar" role="progressbar" aria-label="Fortschritt" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBarInner" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. JavaScript für die Steuerung -->
    <script src="../static/javascript/onboarding.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const nextBtn = document.getElementById('nextBtn');
            const jobInput = document.getElementById('goal_job');
            const jobList = document.getElementById('job_liste');
        
            if (nextBtn && jobInput && jobList) {
                // Wir fangen den Klick ab, BEVOR deine nextPrev-Funktion ausgeführt wird
                nextBtn.addEventListener('click', function(event) {
                    // Wir prüfen, ob Schritt 2 aktuell aktiv/sichtbar ist
                    const step2 = document.getElementById('step-2');

                    // Wenn Schritt 2 die CSS-Klasse "active" hat oder angezeigt wird (je nachdem wie dein JS aufgebaut ist)
                    // Falls dein JS die Klasse .active nutzt:
                    if (step2 && step2.classList.contains('active')) {

                        // Extrahiere alle erlaubten Werte aus der Datalist
                        const validJobs = Array.from(jobList.options).map(option => option.value);
                        const userInput = jobInput.value.trim();
                    
                        // Wenn die Eingabe NICHT in der Liste der erlaubten Jobs enthalten ist
                        if (!validJobs.includes(userInput)) {
                            // Stoppe die Weiterleitung zu Schritt 3 komplett!
                            event.preventDefault();
                            event.stopPropagation();
                        
                            alert(document.body.dataset.invalidJobMessage);

                            jobInput.focus();
                        }
                    }
                }, true); // Das "true" sorgt dafür, dass unser Check vor allen anderen Klick-Events ausgeführt wird!
            }
        });
        new TomSelect("#auswahl", {
            plugins: ['remove_button'], // Erlaubt das Löschen gewählter Items per Klick
            maxItems: null,             // Keine Begrenzung der Auswahlmenge
            persist: false
        });
    </script>

</body>
</html>
