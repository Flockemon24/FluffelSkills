<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluffelSkills - Registrierung</title>
    <link rel="stylesheet" href="../static/css/register.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcRt32OxBtODf9v5mG6F1F7D820X1dC6Jz4ZP09a7aV1l5M7qH6eG8K9L8pQ" crossorigin="anonymous"></script>
</head>

<body data-password-too-short="Das Passwort muss mindestens 8 Zeichen lang sein." data-password-mismatch="Die Passwörter stimmen nicht überein.">
    <nav class="navbar" style="background-color: #081534;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" style="color: #fff;"><a class="nav-link" href="{{ url_for('core.home_page') }}">FluffelSkills</a></span>
        </div>
    </nav>

    <div class="login-body">
        <div class="login-container">
            <form class="login-form" action="/register" method="POST">
                <h2><b>Registrierung</b></h2>
                <input type="text" name="username" placeholder="Benutzername" required>
                <input type="email" name="email" placeholder="E-Mail-Adresse" required>
                
                <!-- Passwort 1 mit Auge-Symbol -->
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" required>
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
                
                <!-- Passwort-Stärke-Balken -->
                <div id="strength-bar" class="strength-meter"></div>

                <!-- Passwort 2 mit Auge-Symbol -->
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Passwort bestätigen" required>
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePasswordVisibility('confirm_password', this)"></i>
                </div>
                
                <!-- Dynamischer Fehlertext unter dem Feld -->
                <div id="error_message" style="color: #dc3545; font-size: 14px; display: none; margin-top: -10px; margin-bottom: 15px; text-align: left;">
                    Die Passwörter stimmen nicht überein oder sind zu kurz.
                </div>

                <label for="terms" class="terms-label">
                    <input type="checkbox" id="terms" name="terms" required>
                    Ich akzeptiere die <a href="{{ url_for('core.terms') }}">Nutzungsbedingungen</a> und die <a href="{{ url_for('core.privacy_policy') }}">Datenschutzerklärung</a>.
                </label>
                
                <!-- Button mit ID für die Sperre -->
                <button type="submit" id="submit_btn" disabled>Registrieren</button>
            </form>
            <p><br>Hast du schon ein Konto?<br><a href="{{ url_for('auth.login') }}">Hier anmelden!</a></p>
        </div>
    </div>

    <script src="../static/javascript/register.js"></script>
</body>
</html>
