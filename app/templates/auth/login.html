<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluffelSkills - Anmelden</title>
    <link rel="stylesheet" href="../static/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar" style="background-color: #081534;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" style="color: #fff;"><a class="nav-link" href="{{ url_for('core.home_page') }}">FluffelSkills</a></span>
        </div>
    </nav>

    <div class="login-body">
        <div class="login-container">
            <form class="login-form" action="/auth/login" method="POST">
                <h2><b>Anmelden</b></h2>
                <input type="text" name="login" placeholder="Benutzername oder E-Mail" required>
                <input type="password" name="password" placeholder="Passwort" required>
                <button type="submit">Anmelden</button>
            </form>
            <p><br>Hast du noch kein Konto?<br><a href="{{ url_for('auth.register') }}">Hier Konto erstellen!</a></p>
        </div>
    </div>
</body>
</html>
